<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEUTSCH A1 PRO — Safari Real Browser QA Runner</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #qa-overlay {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 1.5rem;
      padding: 1.5rem;
      color: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Main Navigation Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.DeutschApp.setTab('lessons')">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-2xl">
            🇩🇪
          </div>
          <div>
            <h1 class="text-xl font-black text-slate-900 dark:text-white">Deutsch A1 Pro</h1>
            <p class="text-[11px] text-slate-500 font-semibold">Safari WebKit Real Browser Test Suite</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-black">
            🔥 Streak: <span id="stat-streak" class="text-amber-500">1</span> დღე
          </div>
          <div class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-black">
            ⚡ XP: <span id="stat-xp" class="text-blue-500">0</span>
          </div>
          <button id="theme-toggle-btn" onclick="window.DeutschApp.toggleTheme()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            🌓
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <!-- QA HUD Overlay -->
  <div id="qa-overlay">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-3">
      <div>
        <h2 class="text-base font-black text-blue-400">Safari Browser QA Harness</h2>
        <p class="text-[10px] text-slate-400">macOS WebKit • Live DOM Automation</p>
      </div>
      <span id="qa-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-blue-500/20 text-blue-300">
        RUNNING...
      </span>
    </div>

    <div id="qa-log" class="space-y-1.5 text-xs"></div>

    <div class="mt-4 pt-3 border-t border-slate-700 flex items-center justify-between text-xs">
      <span class="text-slate-400 font-medium">სტატუსი:</span>
      <span id="qa-summary" class="font-extrabold text-emerald-400">მიმდინარეობს ტესტები...</span>
    </div>
  </div>

  <script src="../js/data.js?v=stage10_multiskill_exam"></script>
  <script src="../js/app.js?v=stage10_multiskill_exam"></script>

  <script>
    async function runSafariBrowserSuite() {
      const log = document.getElementById('qa-log');
      const badge = document.getElementById('qa-badge');
      const summary = document.getElementById('qa-summary');
      const sleep = ms => new Promise(r => setTimeout(r, ms));

      let passed = 0;
      let failed = 0;
      const testDetails = [];

      function logItem(ok, title) {
        if (ok) passed++; else failed++;
        testDetails.push({ ok: Boolean(ok), title });
        const el = document.createElement('div');
        el.className = `p-2 rounded-xl flex items-center justify-between ${ok ? 'bg-emerald-950/40 border border-emerald-800/50 text-emerald-300' : 'bg-rose-950/40 border border-rose-800/50 text-rose-300'}`;
        el.innerHTML = `<span>${title}</span> <strong class="font-black">${ok ? '✓ PASS' : '✕ FAIL'}</strong>`;
        log.appendChild(el);
      }

      await sleep(300);

      // Clean test isolation for deterministic QA runs
      localStorage.clear();
      if ('serviceWorker' in navigator) {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (let r of regs) { await r.unregister(); }
        } catch(e) {}
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          for (let k of keys) { await caches.delete(k); }
        } catch(e) {}
      }

      try {
      // 1. App Boot & Lessons View
      const app = window.DeutschApp;
      logItem(Boolean(window.GERMAN_A1_DATA && window.DeutschApp), "1. Application Boot & Engine Initialization");

      // 2. Tab Navigation
      app.setTab('lessons');
      await sleep(150);
      const lessonCards = document.querySelectorAll('.grid > div');
      logItem(lessonCards.length >= 10, "2. Lessons Grid Rendered (10 Lessons Active)");

      // 3. Open Lesson 1 Detail
      app.openLesson(1);
      await sleep(150);
      const detailTitle = document.querySelector('h1, h2, h3');
      const uAfterOpen = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const grammarNotAutoPassed = !(uAfterOpen.lessonSkillProgress && uAfterOpen.lessonSkillProgress[1] && uAfterOpen.lessonSkillProgress[1].grammarReviewed);
      logItem(grammarNotAutoPassed, "3. Lesson 1 Detail Opened (Grammar NOT Auto-Passed)");

      // 4. Grammar CCQ Interactivity & Verification
      const lesson = window.GERMAN_A1_DATA.lessons.find(l => l.id === 1);
      (lesson.grammar_sections || []).forEach(s => {
        if (s.check) {
          app.onSelectGrammarCheckOption(s.id, s.check.answer, 1);
        }
      });
      app.submitGrammarCheck(1);
      await sleep(150);
      const uAfterGrammar = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const grammarCheckPassed = (uAfterGrammar.lessonSkillProgress && uAfterGrammar.lessonSkillProgress[1] && uAfterGrammar.lessonSkillProgress[1].grammarReviewed);
      logItem(grammarCheckPassed && uAfterGrammar.xp >= 20, "4. Grammar Concept Check Passed (+20 XP Earned)");

      // 5. Flashcards Trainer
      app.setTab('flashcards');
      await sleep(150);
      app.flipFlashcard();
      await sleep(100);
      app.flashcardSM2Action(5);
      app.flashcardSM2Action(5);
      app.flashcardSM2Action(5);
      app.flashcardSM2Action(5);
      app.flashcardSM2Action(5);
      await sleep(150);
      const uAfterCards = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      logItem(uAfterCards.masteredWords && uAfterCards.masteredWords.length > 0, "5. Flashcards SM-2 Rating & Word Mastery Active");

      // 6. Sentence Builder
      app.setTab('sentence-builder');
      await sleep(150);
      const sbChallenge = window.GERMAN_A1_DATA.sentence_builders[app.state.sbIndex];
      sbChallenge.words.forEach(function(targetWord) {
        const idx = app.state.sbAvailableWords.indexOf(targetWord);
        if (idx !== -1) app.addSentenceWord(idx);
      });
      app.checkSentence();
      await sleep(150);
      logItem(app.state.sbIsCorrect === true, "6. Satzbau Sentence Builder Syntax Verification");

      // 7. Core Language Labs (Lesen)
      app.setTab('labs');
      app.switchLabTab('lesen');
      await sleep(150);
      app.onSelectLabLesen(0, 0);
      app.onSelectLabLesen(1, 0);
      app.onSelectLabLesen(2, 0);
      app.submitLabLesen();
      await sleep(150);
      const uAfterLesen = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const lesenRecorded = uAfterLesen.labScores && uAfterLesen.labScores.lesen && uAfterLesen.labScores.lesen['l_lab_1'];
      logItem(Boolean(lesenRecorded), "7. Reading Lab (Lesen) Genuine Scoring & Storage");

      // 8. Core Language Labs (Schreiben 4-Stage Rubric & Draft Persistence)
      app.switchLabTab('schreiben');
      app.nextLabSchreiben(4); // Task 2 letter
      await sleep(150);
      const testDraft = "Lieber Peter, ich habe am Samstag Geburtstag und lade dich herzlich ein. Die Party beginnt um 18 Uhr.";
      app.onSchreibenTextInput(testDraft);
      const draftsRaw = localStorage.getItem('deutsch_a1_writing_drafts_v1');
      const draftsObj = draftsRaw ? JSON.parse(draftsRaw) : {};
      const draftPersisted = Boolean(draftsObj['s_lab_2'] && draftsObj['s_lab_2'] === testDraft);
      logItem(draftPersisted, "8. Writing Draft Persistence to Versioned Storage (deutsch_a1_writing_drafts_v1)");

      app.submitSchreibenLetter();
      await sleep(100);
      app.onToggleSchreibenRubric('s_lab_2', 0);
      app.onToggleSchreibenRubric('s_lab_2', 1);
      app.onToggleSchreibenRubric('s_lab_2', 2);
      app.onToggleSchreibenRubric('s_lab_2', 3);
      app.confirmSchreibenSelfReview('s_lab_2');
      await sleep(150);
      const uAfterSchreiben = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const schreibenCompleted = uAfterSchreiben.labScores && uAfterSchreiben.labScores.schreiben && uAfterSchreiben.labScores.schreiben['s_lab_2'];
      logItem(Boolean(schreibenCompleted && schreibenCompleted.state === 'self_reviewed'), "9. Writing Lab 4-Stage Lifecycle & Rubric Confirmation");

      // 10. Speech Synthesizer Speed Toggles
      logItem(typeof window.speechSynthesis !== 'undefined', "10. Web Speech API Synthesizer Available in Safari");

      // 11. Theme Toggling (Verify bidirectional toggle & state synchronization)
      const wasDark = document.documentElement.classList.contains('dark');
      app.toggleTheme();
      const afterFirstToggle = document.documentElement.classList.contains('dark');
      const toggledSuccessfully = (afterFirstToggle !== wasDark);
      app.toggleTheme();
      const afterSecondToggle = document.documentElement.classList.contains('dark');
      const restoredSuccessfully = (afterSecondToggle === wasDark);
      logItem(toggledSuccessfully && restoredSuccessfully, "11. Dark Mode / Light Mode Theme Switching Operational");

      // 12. Roleplay Chat Simulator (Stage 10 Part 3)
      app.switchLabTab('roleplay');
      await sleep(100);
      app.chooseRoleplayOption(0);
      app.chooseRoleplayOption(0);
      app.chooseRoleplayOption(0);
      app.chooseRoleplayOption(0);
      app.chooseRoleplayOption(0);
      await sleep(150);
      const uAfterRoleplay = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const roleplayCompleted = uAfterRoleplay.labScores && uAfterRoleplay.labScores.roleplay && uAfterRoleplay.labScores.roleplay['rp_cafe'];
      logItem(Boolean(roleplayCompleted && roleplayCompleted.completed === true && roleplayCompleted.score === 100), "12. Roleplay Chat Simulator Conversation Flow & Idempotent Scoring");

      // 13. Official Certificate Modal & Profile Integration (Stage 10 Part 4)
      app.openCertificateModal();
      await sleep(100);
      const certModalArea = document.getElementById('certificate-print-area');
      const certRendered = Boolean(certModalArea && certModalArea.innerHTML.indexOf('ABSCHLUSSZERTIFIKAT') !== -1);
      app.closeCertificateModal();
      logItem(certRendered, "13. Official CEFR A1 Abschlusszertifikat Generator & Modal Preview");

      // 14. Multi-Skill CEFR A1 Exam & Modular Integrity
      app.setTab('exam');
      await sleep(100);
      app.setExamFilterModule('hoeren');
      await sleep(50);
      const examEl = document.getElementById('main-content');
      const hasHoeren = examEl && examEl.innerHTML.indexOf('Modul 1: Hören') !== -1;
      const noPromisedCert = examEl && examEl.innerHTML.indexOf('📜 Deutsch A1 Pro კურსის სერტიფიკატი') === -1;
      app.setExamFilterModule('all');
      logItem(Boolean(hasHoeren && noPromisedCert), "14. Multi-Skill CEFR A1 Exam & Honest Assessment (Hören, Lesen, Satzbau, Schreiben)");

      // 15. Plural Trainer (Hub Mode 2)
      app.setTab('article-trainer');
      await sleep(100);
      app.setTrainerMode('plurals');
      await sleep(100);
      const curPlural = app.state.pluralCurrentWord;
      const initialPluralScore = app.state.pluralScore;
      if (curPlural) app.guessPlural(curPlural.plural);
      await sleep(100);
      logItem(app.state.pluralScore === initialPluralScore + 1, "15. Plural Trainer Multi-Choice & Pedagogical Rule Verification");

      // 16. Verb Conjugation Trainer (Hub Mode 3)
      app.setTrainerMode('verbs');
      await sleep(100);
      const curVerb = app.state.verbCurrentDrill;
      const initialVerbScore = app.state.verbScore;
      if (curVerb) app.guessVerb(curVerb.correct);
      await sleep(100);
      logItem(app.state.verbScore === initialVerbScore + 1, "16. Verb Conjugation Trainer (Präsens Vowel Shifts & Modals)");

      // 17. Wort-Paare Matching Pairs Game (Hub Mode 4)
      app.setTrainerMode('matching');
      await sleep(100);
      const card0 = app.state.matchCards[0];
      const matchIdx = app.state.matchCards.findIndex((c, i) => i !== 0 && c.pairId === card0.pairId && c.type !== card0.type);
      app.onMatchCardClick(0);
      app.onMatchCardClick(matchIdx);
      await sleep(100);
      logItem(app.state.matchMatchedIds.includes(card0.id), "17. Wort-Paare Interactive Card Matching Game");

      // 18. Kurzgeschichten Mini-Stories Lab & Comprehension Check
      app.setTab('labs');
      await sleep(100);
      app.switchLabTab('stories');
      await sleep(100);
      app.selectStory('story_1');
      await sleep(50);
      app.selectStoryAnswer(0, 1);
      app.selectStoryAnswer(1, 2);
      app.selectStoryAnswer(2, 1);
      app.submitStoryQuiz();
      await sleep(100);
      const uAfterStory = JSON.parse(localStorage.getItem('deutsch_a1_pro_v3') || '{"xp":0}');
      const storyCompleted = (uAfterStory.completedStories || []).includes('story_1');
      logItem(storyCompleted && app.state.storyScore === 3, "18. Kurzgeschichten A1 Mini-Story Reading & Comprehension Check");
      } catch (suiteErr) {
        failed++;
        testDetails.push({ ok: false, title: "Critical suite error: " + suiteErr.message });
        const el = document.createElement('div');
        el.className = "p-2 rounded-xl bg-rose-950/40 border border-rose-800/50 text-rose-300";
        el.innerHTML = `<span>Error: ${suiteErr.message}</span> <strong class="font-black">✕ FAIL</strong>`;
        log.appendChild(el);
      }

      // Final Summary (Stage 9.1: Dynamic Status Calculation based on real counts)
      const allPassed = (failed === 0 && passed > 0);
      badge.textContent = allPassed ? "100% PASS" : `${failed} FAILED`;
      badge.className = allPassed
        ? "px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-slate-950"
        : "px-2.5 py-0.5 rounded-full text-[10px] font-black bg-rose-600 text-white";
      summary.textContent = allPassed
        ? `სრული წარმატება: ${passed} გავლილია, ${failed} შეცდომა`
        : `დაფიქსირდა შეცდომა: ${passed} გავლილია, ${failed} შეცდომა`;

      // Set global flag for external testers
      window.__SAFARI_QA_PASSED__ = allPassed;
      window.__SAFARI_QA_RESULTS__ = { passed, failed, success: allPassed };

      // Dispatch machine-readable results to local server (Stage 9.1)
      try {
        await fetch('/api/qa-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passed, failed, success: allPassed, details: testDetails, timestamp: new Date().toISOString() })
        });
      } catch (postErr) {
        console.warn('Could not POST QA results to server:', postErr);
      }

      // Return to main lessons view to display full interface
      app.setTab('lessons');
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runSafariBrowserSuite, 500);
    });
  </script>
</body>
</html>
